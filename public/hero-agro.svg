<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Usine de transformation, rizière et tracteur">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#075C8F"/>
      <stop offset="0.38" stop-color="#1F94BD"/>
      <stop offset="0.68" stop-color="#7BCB9E"/>
      <stop offset="1" stop-color="#4E9F2E"/>
    </linearGradient>
    <linearGradient id="eau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BE0EE" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#4FB6D2" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="brume" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="rangs" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="skewX(-18)">
      <path d="M13 26 V6 M8 26 V10 M18 26 V10" stroke="#2F7D1E" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#fond)"/>

  <!-- soleil et nuages -->
  <circle cx="1230" cy="170" r="110" fill="#FFFFFF" opacity="0.16"/>
  <circle cx="1230" cy="170" r="64" fill="#FFFFFF" opacity="0.28"/>
  <g fill="#FFFFFF" opacity="0.22">
    <ellipse cx="330" cy="130" rx="150" ry="26"/><ellipse cx="420" cy="112" rx="90" ry="24"/>
    <ellipse cx="900" cy="200" rx="170" ry="22"/><ellipse cx="990" cy="184" rx="100" ry="22"/>
  </g>

  <!-- collines lointaines -->
  <path d="M0 470 C160 400 300 430 460 445 C640 462 780 380 980 410 C1180 440 1340 400 1600 450 V560 H0 Z" fill="#0E6F86" opacity="0.38"/>
  <path d="M0 505 C200 465 360 490 560 480 C760 470 900 440 1120 470 C1320 498 1460 470 1600 490 V580 H0 Z" fill="#2B8B6B" opacity="0.5"/>

  <!-- rizière : casiers alternant eau et riz -->
  <path d="M0 540 H1600 V800 H0 Z" fill="#5AAE33"/>
  <g>
    <path d="M0 548 C300 536 700 552 1000 544 C1250 538 1450 546 1600 542 V590 H0 Z" fill="url(#eau)"/>
    <path d="M0 590 C300 580 720 596 1030 588 C1280 582 1450 590 1600 586 V640 H0 Z" fill="#6DBE3C"/>
    <path d="M0 590 C300 580 720 596 1030 588 C1280 582 1450 590 1600 586 V640 H0 Z" fill="url(#rangs)"/>
    <path d="M0 640 C280 630 700 648 1040 640 C1300 634 1460 642 1600 638 V690 H0 Z" fill="url(#eau)"/>
    <path d="M0 690 C300 680 740 698 1050 690 C1300 684 1460 692 1600 688 V800 H0 Z" fill="#4C9A2A"/>
    <path d="M0 690 C300 680 740 698 1050 690 C1300 684 1460 692 1600 688 V800 H0 Z" fill="url(#rangs)"/>
  </g>
  <rect y="470" width="1600" height="90" fill="url(#brume)"/>

  <!-- usine de transformation -->
  <g transform="translate(600 96) scale(0.82)" fill="#0B3B52">
    <rect x="0" y="380" width="360" height="160"/>
    <polygon points="0,380 60,335 60,380 120,335 120,380 180,335 180,380 240,335 240,380 300,335 300,380 360,335 360,380"/>
    <rect x="378" y="330" width="86" height="210"/>
    <rect x="392" y="296" width="20" height="50"/>
    <rect x="430" y="278" width="20" height="68"/>
    <!-- silos -->
    <rect x="484" y="352" width="58" height="188"/>
    <ellipse cx="513" cy="352" rx="29" ry="12"/>
    <rect x="552" y="372" width="50" height="168"/>
    <ellipse cx="577" cy="372" rx="25" ry="10"/>
    <!-- convoyeur -->
    <path d="M360 440 L484 400" stroke="#0B3B52" stroke-width="10" stroke-linecap="round"/>
    <!-- fenêtres éclairées -->
    <g fill="#F6D365" opacity="0.85">
      <rect x="24" y="420" width="36" height="24"/><rect x="82" y="420" width="36" height="24"/><rect x="140" y="420" width="36" height="24"/>
      <rect x="198" y="420" width="36" height="24"/><rect x="256" y="420" width="36" height="24"/><rect x="314" y="420" width="30" height="24"/>
      <rect x="396" y="360" width="16" height="22"/><rect x="424" y="360" width="16" height="22"/>
    </g>
    <rect x="150" y="480" width="70" height="60" fill="#1B6A88"/>
    <!-- fumée -->
    <g fill="#FFFFFF" opacity="0.32">
      <circle cx="402" cy="268" r="14"/><circle cx="420" cy="238" r="20"/><circle cx="446" cy="204" r="26"/><circle cx="478" cy="170" r="30"/>
      <circle cx="440" cy="250" r="12"/><circle cx="462" cy="218" r="18"/><circle cx="494" cy="188" r="22"/>
    </g>
  </g>

  <!-- tracteur -->
  <g transform="translate(1000 0)">
    <!-- roue arrière -->
    <circle cx="150" cy="590" r="82" fill="#0B3B52"/>
    <circle cx="150" cy="590" r="50" fill="#2B7A99"/>
    <circle cx="150" cy="590" r="14" fill="#0B3B52"/>
    <g stroke="#0B3B52" stroke-width="8" opacity="0.9">
      <path d="M150 512 V492 M150 668 V688 M72 590 H52 M228 590 H248 M95 535 L80 520 M205 535 L220 520 M95 645 L80 660 M205 645 L220 660"/>
    </g>
    <!-- roue avant -->
    <circle cx="380" cy="620" r="46" fill="#0B3B52"/>
    <circle cx="380" cy="620" r="26" fill="#2B7A99"/>
    <circle cx="380" cy="620" r="8" fill="#0B3B52"/>
    <!-- carrosserie -->
    <path d="M118 520 H330 L392 552 V600 H118 Z" fill="#0F4F3A"/>
    <path d="M330 520 L392 552 H420 V536 L344 496 Z" fill="#0F4F3A"/>
    <rect x="392" y="560" width="46" height="14" fill="#0B3B52"/>
    <!-- cabine -->
    <path d="M118 520 L138 420 H244 L262 520 Z" fill="#0B3B52"/>
    <path d="M146 430 H236 L250 508 H130 Z" fill="#9BE0EE" opacity="0.7"/>
    <rect x="128" y="410" width="126" height="14" rx="6" fill="#0B3B52"/>
    <!-- échappement -->
    <rect x="356" y="450" width="12" height="70" fill="#0B3B52"/>
    <circle cx="362" cy="440" r="9" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="370" cy="418" r="13" fill="#FFFFFF" opacity="0.25"/>
    <!-- bande jaune -->
    <path d="M150 560 H380" stroke="#F6C445" stroke-width="10" stroke-linecap="round"/>
    <!-- attelage -->
    <path d="M118 585 L60 600 L60 620" stroke="#0B3B52" stroke-width="10" stroke-linecap="round" fill="none"/>
  </g>

  <!-- oiseaux -->
  <g stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M700 250 q14 -16 28 0 q14 -16 28 0"/>
    <path d="M780 300 q10 -12 20 0 q10 -12 20 0"/>
    <path d="M560 210 q9 -11 18 0 q9 -11 18 0"/>
  </g>
</svg>
